plugins {
    id 'com.android.application'
}

android {
    namespace 'com.classplanner.widget'
    compileSdk 34

    defaultConfig {
        applicationId 'com.classplanner.widget'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    // A fixed signing key, so a new version installs over the old one without uninstalling first.
    // Anyone who copies this key could sign look-alike apps, so keep the repository private.
    if (file('../classplanner.jks').exists()) {
        signingConfigs {
            debug {
                storeFile file('../classplanner.jks')
                storePassword 'classplanner'
                keyAlias 'classplanner'
                keyPassword 'classplanner'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
