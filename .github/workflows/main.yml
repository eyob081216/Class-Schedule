name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ClassPlanner.apk

      - name: Keep a copy in the run
        uses: actions/upload-artifact@v4
        with:
          name: ClassPlanner-apk
          path: ClassPlanner.apk

      - name: Publish a download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" ClassPlanner.apk \
            --title "Class Planner v${{ github.run_number }}" \
            --notes "Download ClassPlanner.apk on an Android phone and open it to install."
